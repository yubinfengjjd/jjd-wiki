  script_path: code/05_crosstalk_metabolism.R
  method_disposition: method_impl
  method_id: cell-cell-communication
  implementation_id: cellchat-lr-inference
  disposition_note: 已提炼为独立 R 默认实现 cell-cell-communication/cellchat-lr-inference（default, scRNA-seq），并在 Cai 2026 真实 CellChat 配受体切片上实跑验证。
- step_id: step99_side_by_side
