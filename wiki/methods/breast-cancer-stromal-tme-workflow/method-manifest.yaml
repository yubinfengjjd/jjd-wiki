- step_id: step00_prepare_objects
  title: 单张 Visium 切片与小型 scRNA 复刻对象构建
  script_path: code/00_prepare_spatial_and_scrna.R
  method_disposition: paper_specific_only
  method_id: null
  implementation_id: null
  disposition_note: 基于 Zenodo 19562239 CAA_ST 切片与发表 Marker 构建本地轻量 .qs 回放对象的论文专属数据准备脚本。
- step_id: step00c_style_manifold
  title: 复刻图表公共配色、排版与流形绘图辅助库
  script_path: code/00c_style_and_manifold.R
  method_disposition: paper_specific_only
  method_id: null
  implementation_id: null
  disposition_note: 复刻整图/面板共享视觉样式与坐标辅助函数，不涉及独立统计分析模型。
- step_id: step01_scrna_integration
  title: 基质单细胞多队列批次整合与降维嵌入
  script_path: code/01_scrna_harmony_de.R
  method_disposition: reuse_impl
  method_id: batch-integration
  implementation_id: scp-seurat
  disposition_note: 复用主库已验证的 batch-integration/scp-seurat 标准批次整合实现（复刻脚本在本地采用 Harmony + Seurat 流程；scp-harmony 保留历史未运行状态，优先复用已 verified 标准实现）。
