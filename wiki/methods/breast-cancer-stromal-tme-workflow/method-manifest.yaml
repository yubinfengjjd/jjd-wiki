  script_path: code/02_progeny_roe_cox.R
  method_disposition: method_impl
  method_id: gene-set-scoring
  implementation_id: progeny-pathway-activity
  disposition_note: 已提炼为独立 R 实现 gene-set-scoring/progeny-pathway-activity（variant, scRNA-seq），并在 Cai 2026 真实 Fib 切片上实跑验证。
- step_id: step02b_roe_enrichment
  title: 跨组织与分子亚型卡方 Ro/e 偏好富集分析
  script_path: code/02_progeny_roe_cox.R
  method_disposition: method_impl
  method_id: cell-proportion-composition
  implementation_id: roe-tissue-enrichment
  disposition_note: 已提炼为独立 R 默认实现 cell-proportion-composition/roe-tissue-enrichment（default, scRNA-seq），并在 Cai 2026 真实 Fib 组织计数表上实跑验证。
- step_id: step03_visium_spatial
